name: CI - Orquestacion

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION: PilotoVidaLey.slnx

jobs:
  # ============================================================
  # STAGE 1 - ANALISIS SONAR (build + pruebas + escaneo)
  # Requiere en Settings > Secrets and variables > Actions:
  #   Secret   SONAR_TOKEN         (obligatorio)
  #   Variable SONAR_PROJECT_KEY   (obligatorio)
  #   Variable SONAR_ORGANIZATION  (solo SonarQube Cloud)
  #   Variable SONAR_HOST_URL      (solo SonarQube Server; si queda
  #                                 en PENDIENTE se usa https://sonarcloud.io)
  # Ya estan creados con valor "PENDIENTE": reemplazalo por el real.
  # Las variables opcionales que no uses dejalas en PENDIENTE.
  # ============================================================
  sonar:
    name: Stage 1 - Sonar
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION_VAR: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL_VAR: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Obtener codigo (historial completo para Sonar)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Java (requerido por el scanner)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Los valores "PENDIENTE" se tratan como no configurados.
      - name: Validar configuracion de Sonar
        shell: pwsh
        run: |
          function Pendiente($v) { [string]::IsNullOrWhiteSpace($v) -or $v.Trim() -eq 'PENDIENTE' }
          if (Pendiente $env:SONAR_TOKEN) { throw 'Configura el secret SONAR_TOKEN (hoy esta vacio o en PENDIENTE).' }
          if (Pendiente $env:SONAR_PROJECT_KEY) { throw 'Configura la variable SONAR_PROJECT_KEY (hoy esta vacia o en PENDIENTE).' }
          $sonarHost = if (Pendiente $env:SONAR_HOST_URL_VAR) { 'https://sonarcloud.io' } else { $env:SONAR_HOST_URL_VAR }
          $sonarOrg = if (Pendiente $env:SONAR_ORGANIZATION_VAR) { '' } else { $env:SONAR_ORGANIZATION_VAR }
          "SONAR_HOST_URL=$sonarHost" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SONAR_ORGANIZATION=$sonarOrg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Servidor Sonar: $sonarHost"

      - name: Instalar SonarScanner for .NET
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Iniciar analisis Sonar
        shell: pwsh
        run: |
          $scanArgs = @(
            "/k:$env:SONAR_PROJECT_KEY",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.host.url=$env:SONAR_HOST_URL",
            "/d:sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SONAR_ORGANIZATION)) {
            $scanArgs += "/o:$env:SONAR_ORGANIZATION"
          }
          dotnet sonarscanner begin @scanArgs

      - name: Restaurar y compilar
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION
          dotnet build $env:SOLUTION --configuration Release --no-restore

      - name: Pruebas con cobertura
        shell: pwsh
        run: dotnet test $env:SOLUTION --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults

      - name: Finalizar y enviar analisis a Sonar
        shell: pwsh
        run: dotnet sonarscanner end "/d:sonar.token=$env:SONAR_TOKEN"

  # ============================================================
  # STAGE 2 - SEGURIDAD (ESPACIO RESERVADO)
  # Pendiente: integrar la herramienta que confirme el area de
  # seguridad. Reemplaza el paso "Placeholder" por sus pasos.
  # Solo se ejecuta si Stage 1 (Sonar) termino correctamente.
  # ============================================================
  seguridad:
    name: Stage 2 - Seguridad (pendiente)
    needs: sonar
    runs-on: windows-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v5

      # TODO: agrega aqui los pasos de la herramienta de seguridad
      - name: Placeholder Seguridad
        shell: pwsh
        run: Write-Host "Stage de seguridad pendiente de integrar."
