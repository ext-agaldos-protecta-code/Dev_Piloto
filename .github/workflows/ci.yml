name: CI - Orquestacion

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION: PilotoVidaLey.slnx

jobs:
  # ============================================================
  # STAGE 1 - ANALISIS SONAR (build + pruebas + escaneo)
  # SonarQube Server alojado en una EC2 de AWS.
  # Requiere en Settings > Secrets and variables > Actions:
  #   Secret   SONAR_TOKEN        token de analisis generado en SonarQube
  #   Variable SONAR_HOST_URL     URL de la EC2, ej. http://<ip-o-dns>:9000
  #   Variable SONAR_PROJECT_KEY  clave del proyecto en SonarQube
  # Ya estan creados con valor "PENDIENTE": reemplazalos por los reales.
  # IMPORTANTE: el runner debe poder llegar a la EC2 (Security Group).
  # ============================================================
  sonar:
    name: Stage 1 - Sonar
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Obtener codigo (historial completo para Sonar)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Java (requerido por el scanner)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Los valores "PENDIENTE" se tratan como no configurados.
      - name: Validar configuracion de Sonar
        shell: pwsh
        run: |
          function Pendiente($v) { [string]::IsNullOrWhiteSpace($v) -or $v.Trim() -eq 'PENDIENTE' }
          if (Pendiente $env:SONAR_TOKEN) { throw 'Configura el secret SONAR_TOKEN (hoy esta vacio o en PENDIENTE).' }
          if (Pendiente $env:SONAR_PROJECT_KEY) { throw 'Configura la variable SONAR_PROJECT_KEY (hoy esta vacia o en PENDIENTE).' }
          if (Pendiente $env:SONAR_HOST_URL) { throw 'Configura la variable SONAR_HOST_URL con la URL de la EC2 (hoy esta vacia o en PENDIENTE).' }
          Write-Host "Servidor Sonar: $env:SONAR_HOST_URL"

      - name: Verificar conexion con SonarQube (EC2)
        shell: pwsh
        run: |
          $url = $env:SONAR_HOST_URL.TrimEnd('/') + '/api/system/status'
          try {
            $status = Invoke-RestMethod -Uri $url -TimeoutSec 30
          } catch {
            throw "No se pudo conectar a $url. Revisa que la EC2 este encendida y que su Security Group permita trafico desde el runner. Detalle: $($_.Exception.Message)"
          }
          Write-Host "Estado de SonarQube: $($status.status) (version $($status.version))"
          if ($status.status -ne 'UP') { throw "SonarQube no esta disponible (estado: $($status.status))." }

      - name: Instalar SonarScanner for .NET
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Iniciar analisis Sonar
        shell: pwsh
        run: |
          $scanArgs = @(
            "/k:$env:SONAR_PROJECT_KEY",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.host.url=$env:SONAR_HOST_URL",
            "/d:sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml"
          )
          dotnet sonarscanner begin @scanArgs

      - name: Restaurar y compilar
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION
          dotnet build $env:SOLUTION --configuration Release --no-restore

      - name: Pruebas con cobertura
        shell: pwsh
        run: dotnet test $env:SOLUTION --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults

      - name: Finalizar y enviar analisis a Sonar
        shell: pwsh
        run: dotnet sonarscanner end "/d:sonar.token=$env:SONAR_TOKEN"

  # ============================================================
  # STAGE 2 - SEGURIDAD (ESPACIO RESERVADO)
  # Pendiente: integrar la herramienta que confirme el area de
  # seguridad. Reemplaza el paso "Placeholder" por sus pasos.
  # Solo se ejecuta si Stage 1 (Sonar) termino correctamente.
  # ============================================================
  seguridad:
    name: Stage 2 - Seguridad (pendiente)
    needs: sonar
    runs-on: windows-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v5

      # TODO: agrega aqui los pasos de la herramienta de seguridad
      - name: Placeholder Seguridad
        shell: pwsh
        run: Write-Host "Stage de seguridad pendiente de integrar."
